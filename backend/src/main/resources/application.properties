spring.application.name=rentease-backend
server.port=8080

# ---- Database (Supabase PostgreSQL). The password comes from the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.hnitbljzusoagfrglypg}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA: tables are created/updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT
app.jwt.secret=${JWT_SECRET:rentease-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=60

# ---- CORS (frontend dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}