spring.application.name=rentease-backend
server.port=8080

# ---- Database (Supabase PostgreSQL). The login comes from the DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=jdbc:postgresql://db.hnitbljzusoagfrglypg.supabase.co:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA: tables are created/updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (set JWT_SECRET to your own value, at least 32 characters)
app.jwt.secret=${JWT_SECRET:rentease-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=60

# ---- CORS (frontend dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Password reset (Increment 2)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=15

# ---- Email for reset links (optional). The mail host, username and password are NOT set here:
# put them in application-local.properties (see application-local.properties.example) or in environment variables.
# Without a mail host the backend runs in DEV MODE and prints the reset link in the console instead.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# ---- SMS through Semaphore (Increment 3). Without an API key the backend runs in DEV MODE:
# messages are not sent, they are recorded as FAILED in sms_log. Set SEMAPHORE_API_KEY (and optionally
# SEMAPHORE_SENDER_NAME) as environment variables. Never put the key in this file.
app.sms.semaphore.api-key=${SEMAPHORE_API_KEY:}
app.sms.semaphore.sender-name=${SEMAPHORE_SENDER_NAME:}
app.sms.semaphore.url=${SEMAPHORE_URL:https://api.semaphore.co/api/v4/messages}
