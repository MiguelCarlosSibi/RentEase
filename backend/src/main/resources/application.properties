spring.application.name=rentease-backend
server.port=8080

# ---- Database (MySQL / XAMPP). Override with environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rentease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA: tables are created/updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT (set JWT_SECRET to your own value, at least 32 characters)
app.jwt.secret=${JWT_SECRET:rentease-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=60

# ---- CORS (frontend dev server)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Password reset (Increment 2)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.expiration-minutes=15

# ---- Email for reset links (optional). The mail host, username and password are NOT set here:
# put them in application-local.properties (see application-local.properties.example) or in environment variables.
# Without a mail host the backend runs in DEV MODE and prints the reset link in the console instead.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
